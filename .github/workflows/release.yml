name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # keyless cosign signing (Sigstore OIDC)

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test before releasing
        run: |
          (cd web && npm ci && npm test && npm run build)
          go vet ./...
          go test ./...
      # Stay on v3: v4 installs cosign v3, whose sign-blob needs --bundle (would
      # break the signing config in .goreleaser.yaml and install.sh's check).
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
